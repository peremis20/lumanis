name: Deploy to GitHub Pages

# Pages is configured to publish from the gh-pages branch, so this builds the
# app and pushes the result there; GitHub's own "pages build and deployment"
# job takes it from there. Nothing here touches the Pages source setting.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Build the single-file version
        working-directory: app
        run: npm run build:single

      - name: Collect the site
        run: |
          cp standalone/scripturepath.html app/dist/
          cp standalone/design-reference.html app/dist/
          touch app/dist/.nojekyll

      - name: Publish to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth 1
          git worktree add site origin/gh-pages
          cd site
          git switch -C gh-pages
          # Replace the published tree, keeping the worktree's git metadata.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../app/dist/. .
          git add -A
          if git diff --cached --quiet; then
            echo "The published build is already up to date."
          else
            git commit -m "Deploy ${GITHUB_SHA:0:7}"
            git push origin gh-pages
          fi
